<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="nav-logo">Store</a>
            <div class="nav-links">
                <a href="#">Store</a>
                <a href="#">Mac</a>
                <a href="#">iPad</a>
                <a href="#">iPhone</a>
                <a href="#">Support</a>
            </div>
            <button id="cartToggle" class="cart-toggle-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12L6 6zm0 0L5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
                Bag (<span id="cartCountBadge">0</span>)
            </button>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <p class="hero-eyebrow">Fall Lineup</p>
            <h1>iPhone 17 Pro</h1>
            <p>Designed to be desired.</p>
            <div class="hero-cta">
                <a href="#productGrid" class="cta-primary">Shop now</a>
                <a href="#productGrid" class="cta-secondary">Learn more</a>
            </div>
        </div>
    </header>

    <main class="store-container">
        <div class="store-heading">
            <h2>The latest.</h2>
            <p>Take a look at what's new right now.</p>
        </div>
        <div id="productGrid" class="product-grid"></div>
    </main>

    <footer class="site-footer">
        A concept store built for demonstration. Not affiliated with Apple Inc.
    </footer>

    <div id="cartOverlay" class="cart-overlay"></div>
    <aside id="cartDrawer" class="cart-drawer">
        <div class="drawer-header">
            <h3>Your Bag</h3>
            <button id="closeCart" class="close-btn" aria-label="Close cart">×</button>
        </div>
        <div id="cartItems" class="drawer-body"></div>
        <div class="drawer-footer">
            <div class="total-row">
                <span>Total</span>
                <span id="cartTotal">$0</span>
            </div>
            <button id="checkoutBtn" class="checkout-button" disabled>Check Out</button>
        </div>
    </aside>

    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
